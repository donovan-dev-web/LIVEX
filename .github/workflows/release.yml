#
# Publication uniquement : aucune compilation, aucune signature ici.
# Le ZIP public est construit localement avec
#   pwsh scripts/release/build-release.ps1 -Version <version> -Tag <tag> -Upload
# Ce workflow crée la release (notes générées) pour que l'upload local
# dispose d'une cible stable.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex. livex-v1.0.0)"
        required: true
      version:
        description: "Version affichée (ex. 1.0.0)"
        required: true
      draft:
        description: "Créer en brouillon"
        type: boolean
        default: true
      prerelease:
        description: "Marquer comme pré-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    name: Créer la release
    runs-on: ubuntu-latest
    steps:
      - name: Créer la release sans artefact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: LIVEX ${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            Release **LIVEX ${{ inputs.version }}**.

            Aucune compilation n'est effectuée par GitHub Actions. Le ZIP public
            a été construit localement puis téléversé sur cette release :

                pwsh scripts/release/build-release.ps1 -Version ${{ inputs.version }} -Tag ${{ inputs.tag }} -Upload

            Téléchargez uniquement `LIVEX-${{ inputs.version }}-win-x64-core.zip`,
            puis lancez `livex-setup.exe` qu'il contient.
