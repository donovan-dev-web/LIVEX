name: Release

on:
  push:
    tags:
      - "syne-v*"
      - "echos-v*"
      - "prism-v*"
      - "livex-v*"

env:
  DOTNET_VERSION: "10.0.x"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  verify:
    name: Vérification finale build + tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # --- SYNE (.NET) ---
      - name: Build & tests SYNE
        if: hashFiles('syne/global.json') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: syne/global.json
      - name: dotnet restore/build/test
        if: hashFiles('syne/global.json') != ''
        working-directory: syne
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release --warnaserror
          dotnet test --no-build --configuration Release

      # --- ECHOS (Python + UI) ---
      - name: Setup Python
        if: hashFiles('echos/requirements-dev.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pytest ECHOS
        if: hashFiles('echos/requirements-dev.txt') != ''
        working-directory: echos
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Setup Node
        if: hashFiles('echos/echos-ui/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: echos/echos-ui/package-lock.json
      - name: UI ECHOS (ci + lint + test)
        if: hashFiles('echos/echos-ui/package.json') != ''
        working-directory: echos/echos-ui
        run: |
          npm ci
          npm run lint
          npm test -- --run

      # --- GitHub Release ---
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true

      # TODO (conteneurisation — hors périmètre U0) :
      #   - renvoyer la re-vérification + build images Docker multi-stage (syne, echos, echos-ui)
      #   - publication GHCR avec retag `latest` (registre ghcr.io/${{ github.repository_owner_lowercase }})
      #   - réactivation sur les tags composants (CI_CD.md §4)