name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  dotnet-build:
    name: Build & tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Tests
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
      - name: Couverture
        run: |
          dotnet collect coverage \
            --runsettings ci/coverlet.sim.runsettings \
            --output TestResults/Coverage
      - name: Upload résultats
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults
          retention-days: 7

  echos-ui:
    name: Lint & tests (interface ECHOS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echos-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  docker:
    name: Build images Docker
    runs-on: ubuntu-latest
    needs: [dotnet-build, echos-ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build compose
        run: docker compose build