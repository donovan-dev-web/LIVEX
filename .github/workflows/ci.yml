name: CI

on:
  pull_request:
    # main est inclus pour que la protection « CI verte » soit applicable :
    # sans ce déclencheur, une PR de release ou de hotfix n'exécuterait
    # aucun check et resterait bloquée indéfiniment sur un status attendu.
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  DOTNET_VERSION: "10.0.x"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Détection des composants modifiés (filtre par chemin, sans action tierce)
  # ---------------------------------------------------------------------
  changes:
    name: Composants modifiés
    runs-on: ubuntu-latest
    outputs:
      syne: ${{ steps.diff.outputs.syne }}
      echos: ${{ steps.diff.outputs.echos }}
      syne_mock: ${{ steps.diff.outputs.syne_mock }}
      launcher: ${{ steps.diff.outputs.launcher }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ]; then BASE="develop"; fi
          for comp in syne echos syne-mock launcher; do
            count=$(git diff --name-only "$BASE...HEAD" -- "$comp/" 2>/dev/null | wc -l | tr -d ' ')
            key=$(echo "$comp" | tr '-' '_')
            if [ "$count" -gt 0 ]; then echo "$key=true" >> "$GITHUB_OUTPUT"; else echo "$key=false" >> "$GITHUB_OUTPUT"; fi
          done
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Validation transverse (toujours exécutée)
  # ---------------------------------------------------------------------
  repo-check:
    name: Structure & conventions (transverse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers de socle présents
        run: |
          test -f .editorconfig || { echo "::error::.editorconfig manquant"; exit 1; }
          test -f .gitignore   || { echo "::error::.gitignore manquant";   exit 1; }
          test -f LICENSE      || { echo "::error::LICENSE manquante";     exit 1; }
      - name: Pas de secrets commités (heuristique)
        run: |
          if grep -rE --exclude='ci.yml' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.cs' --include='*.py' -nE '(ghp_[0-9A-Za-z]{36}|gho_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{22,}|AKIA[0-9A-Z]{16})' . 2>/dev/null | grep -v '\.github/workflows/'; then
            echo "::error::Secret détecté dans le dépôt"; exit 1;
          fi

  # ---------------------------------------------------------------------
  # SYNE — .NET (build + tests xUnit)
  # ---------------------------------------------------------------------
  syne-dotnet:
    name: Build & tests (SYNE .NET)
    needs: [changes, repo-check]
    if: needs.changes.outputs.syne == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: syne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: syne/global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release --warnaserror
      - name: Tests
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
      - name: Upload résultats
        uses: actions/upload-artifact@v4
        with:
          name: syne-test-results
          path: syne/TestResults
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # ECHOS — Python (FastAPI / ingestion / analyse)
  # ---------------------------------------------------------------------
  echos-python:
    name: Tests & lint (ECHOS Python)
    needs: [changes, repo-check]
    if: needs.changes.outputs.echos == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: python -m flake8 echos
      - name: Tests pytest
        run: python -m pytest -q


  # U8 — vrai flux SYNE vers ECHOS (le runtime PRISM démarre après U8)
  syne-echos-u8-integration:
    name: Intégration U8 (SYNE → ECHOS)
    needs: [changes, repo-check]
    if: needs.changes.outputs.syne == 'true' || needs.changes.outputs.echos == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: syne/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Restore and build SYNE
        working-directory: syne
        run: dotnet build Syne.sln --configuration Release
      - name: Install ECHOS
        working-directory: echos
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Real SYNE WebSocket → ECHOS storage and API
        env:
          LIVEX_SYNE_E2E: "1"
        working-directory: echos
        run: python -m pytest echos/tests/test_syne_echos_integration.py -q --no-cov

  # ---------------------------------------------------------------------
  # SYNE-MOCK - contrat de developpement des mocks Unreal (Node)
  # ---------------------------------------------------------------------
  syne-mock-node:
    name: Tests (SYNE-MOCK Node)
    needs: [changes, repo-check]
    if: needs.changes.outputs.syne_mock == 'true'
    runs-on: ubuntu-latest
    # Garde-fou : la suite doit rester un test unitaire court. Un run qui traine
    # signale une fuite de descripteurs, pas un test lent.
    timeout-minutes: 5
    defaults:
      run:
        working-directory: syne-mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: syne-mock/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test

  # ---------------------------------------------------------------------
  # SYNE-MOCK - le contrat du mock doit rester consommable par ECHOS.
  # Couvre l'ordre des trames (snapshot avant les evenements du tick), que
  # ECHOS refuse sinon via `ingestion.stream.aligned_ticks`.
  # ---------------------------------------------------------------------
  syne-mock-echos-integration:
    name: Intégration mock → ECHOS
    needs: [changes, repo-check]
    if: needs.changes.outputs.syne_mock == 'true' || needs.changes.outputs.echos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: syne-mock/package-lock.json
      - name: Install syne-mock
        working-directory: syne-mock
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ECHOS
        working-directory: echos
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Mock WebSocket → ECHOS storage and API
        env:
          LIVEX_MOCK_E2E: "1"
        working-directory: echos
        run: python -m pytest echos/tests/test_syne_mock_integration.py -q --no-cov

  # ---------------------------------------------------------------------
  # LAUNCHER - .NET (build + tests unitaires, intégration et bout en bout)
  # ---------------------------------------------------------------------
  launcher-dotnet:
    name: Build & tests (Launcher .NET)
    needs: [changes, repo-check]
    if: needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: launcher/global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build Launcher.sln --no-restore --configuration Release --warnaserror
      - name: Tests unitaires
        run: dotnet test Launcher.Tests.Unit --no-build --configuration Release --logger "trx;LogFileName=unit.trx" --results-directory TestResults
      - name: Tests d'intégration (stubs réels)
        run: dotnet test Launcher.Tests.Integration --no-build --configuration Release --logger "trx;LogFileName=integration.trx" --results-directory TestResults
      - name: Tests bout en bout (campagne complète)
        run: dotnet test Launcher.Tests.EndToEnd --no-build --configuration Release --logger "trx;LogFileName=e2e.trx" --results-directory TestResults
      - name: Upload résultats
        uses: actions/upload-artifact@v4
        with:
          name: launcher-test-results
          path: launcher/TestResults
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # ECHOS - UI (React + TypeScript)
  # ---------------------------------------------------------------------
  echos-ui:
    name: Lint & tests (ECHOS UI)
    needs: [changes, repo-check]
    if: needs.changes.outputs.echos == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echos/echos-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: echos/echos-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build