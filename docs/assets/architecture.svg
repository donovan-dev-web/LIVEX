<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" width="1160" height="480" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif'>
<title id="t">Architecture runtime de LIVEX — PRISM V2</title>
<desc id="d">SYNE porte la cognition et échange avec l'hôte PRISM V2 par le contrat 1.0.0 : commandes vers PRISM, observations vers SYNE. L'hôte publie un flux de lecture consommé par l'ingestion ECHOS (SQLite + Parquet, API REST) et par le viewer Silk.NET/OpenGL. Le Launcher orchestre les processus et propose les modes Hôte et Viewer ; le viewer relaie Play, Pause, Stop et Quit à l'hôte, qui reste l'autorité du monde.</desc>
