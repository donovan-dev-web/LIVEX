<text x="58" y="92" font-size="26" font-weight="700" fill="#f5efe4">SYNE</text>
<text x="58" y="118" font-size="14.5" fill="#9fb8c8">Simulation et monde</text>
<text x="58" y="150" font-size="13.5" fill="#3fb8ea">source de vérité</text>

<rect x="350" y="50" width="470" height="130" rx="14" fill="#a97bff" fill-opacity=".08" stroke="#a97bff" stroke-width="1.6"/>
<text x="372" y="92" font-size="26" font-weight="700" fill="#f5efe4">ECHOS</text>
<text x="372" y="115" font-size="14.5" fill="#9fb8c8">Observation et analyse</text>
<rect x="372" y="132" width="116" height="34" rx="17" fill="#090C16" stroke="#a97bff" stroke-opacity=".7"/>
<text x="430.0" y="154" font-size="13.5" text-anchor="middle" fill="#dbe6ee">Ingestion</text>
<rect x="498" y="132" width="168" height="34" rx="17" fill="#090C16" stroke="#a97bff" stroke-opacity=".7"/>
<text x="582.0" y="154" font-size="13.5" text-anchor="middle" fill="#dbe6ee">SQLite + Parquet</text>
<rect x="676" y="132" width="124" height="34" rx="17" fill="#090C16" stroke="#a97bff" stroke-opacity=".7"/>
<text x="738.0" y="154" font-size="13.5" text-anchor="middle" fill="#dbe6ee">API REST :5000</text>

<rect x="906" y="50" width="170" height="130" rx="14" fill="#c9d6e0" fill-opacity=".08" stroke="#c9d6e0" stroke-width="1.6"/>
