<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="t d" font-family='"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Architecture de LIVEX</title>
<desc id="d">SYNE diffuse snapshots et événements par WebSocket vers l'ingestion ECHOS, qui alimente SQLite et Parquet puis l'API REST consommée par le Launcher. SYNE expose ses contrats au projet Unreal PRISM, qui intègre le plugin PRISM-LDK ; syne-mock émule ces contrats pour les tests.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090C16"/><stop offset="1" stop-color="#141a33"/></linearGradient>
  <marker id="ah-3fb8ea" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb8ea"/></marker><marker id="ah-a97bff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a97bff"/></marker><marker id="ah-f0a846" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f0a846"/></marker><marker id="ah-c9d6e0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9d6e0"/></marker><marker id="ah-8fb0c4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb0c4"/></marker>
</defs>
