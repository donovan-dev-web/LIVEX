[project]
name = "echos"
version = "0.1.0"
description = "ECHOS — observatoire LIVEX : analyse, observation et pilotage de SYNE (FastAPI local)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "httpx>=0.27,<1.0",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "flake8>=7.1,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["echos/tests"]
addopts = "-q --cov=echos --cov-report=term-missing --cov-fail-under=80"